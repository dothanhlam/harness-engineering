<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>harness · monitor</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --panel-2: #f0f2f5; --border: #e2e5ea;
    --text: #1b1f24; --dim: #6b7280; --faint: #9aa1ab;
    --accent: #2563eb; --ok: #16a34a; --err: #dc2626; --warn: #d97706;
    --shadow: 0 1px 2px rgba(0,0,0,.06), 0 1px 3px rgba(0,0,0,.05);
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1116; --panel: #161b22; --panel-2: #1c222b; --border: #2a313c;
      --text: #e6e9ee; --dim: #9aa4b2; --faint: #6b7480;
      --accent: #4f8cff; --ok: #3fb950; --err: #f85149; --warn: #d29922;
      --shadow: none;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0e1116; --panel: #161b22; --panel-2: #1c222b; --border: #2a313c;
    --text: #e6e9ee; --dim: #9aa4b2; --faint: #6b7480;
    --accent: #4f8cff; --ok: #3fb950; --err: #f85149; --warn: #d29922; --shadow: none;
  }
  :root[data-theme="light"] {
    --bg: #f6f7f9; --panel: #ffffff; --panel-2: #f0f2f5; --border: #e2e5ea;
    --text: #1b1f24; --dim: #6b7280; --faint: #9aa1ab;
    --accent: #2563eb; --ok: #16a34a; --err: #dc2626; --warn: #d97706;
    --shadow: 0 1px 2px rgba(0,0,0,.06), 0 1px 3px rgba(0,0,0,.05);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans);
    font-size: 14px; line-height: 1.5;
  }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 20px 20px 60px; }

  header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--faint); flex: none; }
  .dot.waiting { background: var(--accent); }
  .dot.running { background: var(--warn); animation: pulse 1.2s ease-in-out infinite; }
  .dot.success { background: var(--ok); }
  .dot.failed  { background: var(--err); }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }

  h1 { font-size: 15px; font-weight: 650; margin: 0; letter-spacing: .2px; }
  .run-id { font-family: var(--mono); color: var(--dim); font-size: 12.5px; }
  .badge {
    font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .5px;
    padding: 2px 8px; border-radius: 999px; background: var(--panel-2); color: var(--dim);
    border: 1px solid var(--border);
  }
  .spacer { flex: 1; }
  .elapsed { font-family: var(--mono); font-size: 13px; color: var(--dim); }
  .conn { font-size: 11.5px; color: var(--faint); }
  button.theme {
    background: var(--panel); border: 1px solid var(--border); color: var(--dim);
    border-radius: 8px; padding: 4px 9px; cursor: pointer; font-size: 13px;
  }

  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    box-shadow: var(--shadow); padding: 16px; margin-bottom: 16px;
  }
  .card h2 {
    font-size: 11px; text-transform: uppercase; letter-spacing: .6px; color: var(--faint);
    margin: 0 0 12px; font-weight: 650;
  }

  /* pipeline strip */
  .pipe { display: flex; align-items: stretch; gap: 6px; flex-wrap: wrap; }
  .stage {
    flex: 1; min-width: 92px; border: 1px solid var(--border); border-radius: 9px;
    padding: 10px 12px; background: var(--panel-2); position: relative; transition: .15s;
  }
  .stage .name { font-weight: 600; font-size: 13px; }
  .stage .sub { font-size: 11px; color: var(--dim); font-family: var(--mono); min-height: 14px; }
  .stage.done { border-color: color-mix(in srgb, var(--ok) 45%, var(--border)); }
  .stage.done .name::before { content: "✓ "; color: var(--ok); }
  .stage.active {
    border-color: var(--accent);
    box-shadow: 0 0 0 1px var(--accent) inset;
  }
  .stage.active .name { color: var(--accent); }
  .stage.failed { border-color: var(--err); }
  .stage.failed .name::before { content: "✗ "; color: var(--err); }

  /* stat tiles */
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
  .tile { background: var(--panel-2); border: 1px solid var(--border); border-radius: 9px; padding: 11px 13px; }
  .tile .k { font-size: 10.5px; text-transform: uppercase; letter-spacing: .5px; color: var(--faint); }
  .tile .v { font-size: 20px; font-weight: 650; font-family: var(--mono); margin-top: 2px; }
  .tile .v small { font-size: 12px; color: var(--dim); font-weight: 500; }

  /* hitl banner */
  #hitl {
    display: none; align-items: center; gap: 10px; border-radius: 12px; padding: 12px 16px;
    margin-bottom: 16px; background: color-mix(in srgb, var(--warn) 14%, var(--panel));
    border: 1px solid color-mix(in srgb, var(--warn) 55%, var(--border)); color: var(--text);
  }
  #hitl.show { display: flex; }
  #hitl .pi { font-size: 18px; }

  /* tasks */
  #tasks-card { display: none; }
  .tasks { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; }
  .task { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--panel-2); }
  .task .tn { font-family: var(--mono); font-size: 12.5px; font-weight: 600; }
  .task .ts { font-size: 11px; color: var(--dim); margin-left: auto; }
  .task .tdot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex: none; }
  .task .tdot.ok { background: var(--ok); } .task .tdot.err { background: var(--err); } .task .tdot.run { background: var(--warn); }

  /* log */
  .log-head { display: flex; align-items: center; gap: 12px; }
  .log-head label { font-size: 12px; color: var(--dim); display: flex; align-items: center; gap: 5px; cursor: pointer; }
  #log { font-family: var(--mono); font-size: 12.5px; max-height: 46vh; overflow-y: auto; margin-top: 10px; }
  .row { display: flex; gap: 8px; padding: 1.5px 0; white-space: pre-wrap; word-break: break-word; }
  .row .t { color: var(--faint); flex: none; }
  .row .g { flex: none; width: 1.2em; text-align: center; }
  .row .lane { color: var(--faint); }
  .ok { color: var(--ok); } .err { color: var(--err); } .warn { color: var(--warn); }
  .info { color: var(--accent); } .dim { color: var(--dim); }
  .empty { color: var(--faint); padding: 8px 0; font-family: var(--sans); }
  body.hide-output .row.out { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="dot" id="dot"></span>
    <h1>harness monitor</h1>
    <span class="run-id" id="runid">—</span>
    <span class="badge" id="mode" style="display:none"></span>
    <span class="spacer"></span>
    <span class="elapsed" id="elapsed">0.0s</span>
    <span class="conn" id="conn">connecting…</span>
    <button class="theme" id="theme" title="Toggle theme">◑</button>
  </header>

  <div id="hitl">
    <span class="pi">⏸</span>
    <span id="hitl-text">Awaiting approval — answer in the run's terminal.</span>
  </div>

  <div class="card">
    <h2>Pipeline</h2>
    <div class="pipe" id="pipe"></div>
  </div>

  <div class="card">
    <h2>Metrics</h2>
    <div class="tiles" id="tiles"></div>
  </div>

  <div class="card" id="tasks-card">
    <h2>Modules</h2>
    <div class="tasks" id="tasks"></div>
  </div>

  <div class="card">
    <div class="log-head">
      <h2 style="margin:0">Event log</h2>
      <span class="spacer" style="flex:1"></span>
      <label><input type="checkbox" id="show-output" checked> agent output</label>
    </div>
    <div id="log"><div class="empty">Waiting for a run to start…</div></div>
  </div>
</div>

<script>
"use strict";

// Canonical main-line stages, in order, with short labels.
const STAGES = [
  ["DEV_CODING", "Dev"], ["QA_TESTING", "QA"], ["HUMAN_IN_THE_LOOP", "HITL"],
  ["DEVOPS_DELIVER", "DevOps"], ["MEMORY_COMPACTION", "Memory"], ["COMPLETED", "Done"],
];
const STAGE_INDEX = Object.fromEntries(STAGES.map(([s], i) => [s, i]));

const el = id => document.getElementById(id);
const LOG_CAP = 600;

let state = null;
function reset(runId) {
  state = {
    runId, mode: "", startMs: null, endMs: null, finished: false, success: null,
    stageIdx: -1, activeStage: "", attempt: "", seen: new Set(),
    prompt: 0, evalT: 0, retries: 0, healing: null, files: 0, loc: null,
    tasks: {},
  };
  el("log").innerHTML = "";
  renderPipe(); renderTiles(); el("tasks-card").style.display = "none";
  el("hitl").classList.remove("show");
}

// ── pipeline strip ────────────────────────────────────────────────
function renderPipe() {
  const pipe = el("pipe");
  pipe.innerHTML = "";
  for (const [stage, label] of STAGES) {
    const idx = STAGE_INDEX[stage];
    const d = document.createElement("div");
    d.className = "stage";
    let sub = "";
    if (state) {
      const passedFail = state.finished && !state.success;
      if (stage === state.activeStage) {
        d.classList.add("active");
        sub = state.attempt;
      }
      if (idx < state.stageIdx) d.classList.add("done");
      if (stage === "COMPLETED" && state.finished) {
        d.classList.remove("active");
        d.classList.add(state.success ? "done" : "failed");
      }
      if (passedFail && stage === state.activeStage && stage !== "COMPLETED") {
        d.classList.remove("active"); d.classList.add("failed");
      }
    }
    d.innerHTML = `<div class="name">${label}</div><div class="sub">${sub}</div>`;
    pipe.appendChild(d);
  }
}

// ── metric tiles ──────────────────────────────────────────────────
function renderTiles() {
  const s = state || {};
  const healing = s.healing === true ? '<span class="ok">✓ yes</span>'
    : s.healing === "active" ? '<span class="warn">healing…</span>' : "—";
  const tiles = [
    ["Tokens", `${fmtNum(s.prompt || 0)}<small> → ${fmtNum(s.evalT || 0)}</small>`],
    ["Retries", `${s.retries || 0}`],
    ["Self-heal", healing],
    ["Files", `${s.files || 0}`],
    ["Lines", s.loc == null ? "—" : `${s.loc}`],
  ];
  el("tiles").innerHTML = tiles.map(([k, v]) =>
    `<div class="tile"><div class="k">${k}</div><div class="v">${v}</div></div>`).join("");
}

// ── module lanes (epic) ───────────────────────────────────────────
function renderTasks() {
  const names = Object.keys(state.tasks);
  if (state.mode !== "epic" || names.length === 0) { el("tasks-card").style.display = "none"; return; }
  el("tasks-card").style.display = "";
  el("tasks").innerHTML = names.map(n => {
    const t = state.tasks[n];
    const cls = t.pass === true ? "ok" : t.pass === false ? "err" : "run";
    return `<div class="task"><span class="tdot ${cls}"></span><span class="tn">${esc(n)}</span><span class="ts">${esc(t.stage || "")}</span></div>`;
  }).join("");
}

// ── event handling ────────────────────────────────────────────────
function handle(ev) {
  if (!state || ev.run_id !== state.runId) reset(ev.run_id);
  if (state.seen.has(ev.seq)) return;      // dedup a replay after reconnect
  state.seen.add(ev.seq);

  const p = ev.payload || {};
  switch (ev.kind) {
    case "run_started":
      state.mode = p.mode || "task";
      state.startMs = tsMs(ev.ts);
      el("runid").textContent = ev.run_id || "—";
      const badge = el("mode"); badge.textContent = p.mode || "task"; badge.style.display = "";
      setStatus("running");
      break;
    case "stage_changed": {
      const idx = STAGE_INDEX[p.stage];
      // Only main-line stages drive the strip. Off-line stages like BA_REFACTOR
      // (delegation) must not overwrite the active stage's attempt count, or the
      // still-active QA pill would flash a stale "attempt 1/3".
      if (idx != null) {
        state.stageIdx = idx;
        state.activeStage = p.stage;
        state.attempt = p.max_retries > 1 ? `attempt ${p.retry + 1}/${p.max_retries}` : "";
      }
      if (ev.task) touchTask(ev.task, p.stage);
      renderPipe();
      break;
    }
    case "agent_done":
      state.prompt += p.prompt_tokens || 0;
      state.evalT += p.eval_tokens || 0;
      renderTiles();
      break;
    case "qa_result":
      if (ev.task) touchTask(ev.task, "QA", p.passed);
      break;
    case "retry":
      state.retries += 1;
      if (state.healing !== true) state.healing = "active";
      renderTiles();
      break;
    case "file_written":
      state.files += 1; renderTiles();
      break;
    case "hitl_prompt": {
      const t = p.timeout_seconds ? ` (auto-yes in ${p.timeout_seconds}s)` : "";
      el("hitl-text").textContent = `Awaiting approval${t} — answer in the run's terminal.`;
      el("hitl").classList.add("show");
      break;
    }
    case "hitl_resolved":
      el("hitl").classList.remove("show");
      break;
    case "run_finished":
      state.finished = true;
      state.success = !!p.success;
      state.endMs = state.startMs != null ? state.startMs + (p.duration_seconds || 0) * 1000 : null;
      if (typeof p.total_prompt_tokens === "number") state.prompt = p.total_prompt_tokens;
      if (typeof p.total_eval_tokens === "number") state.evalT = p.total_eval_tokens;
      if (typeof p.total_retries_used === "number") state.retries = p.total_retries_used;
      state.healing = !!p.code_healing_success;
      if (typeof p.lines_of_code_generated === "number") state.loc = p.lines_of_code_generated;
      setStatus(state.success ? "success" : "failed");
      renderPipe(); renderTiles();
      break;
  }
  appendLog(ev);
  if (ev.task) renderTasks();
}

function touchTask(name, stage, pass) {
  const t = state.tasks[name] || (state.tasks[name] = { stage: "", pass: null });
  if (stage) t.stage = stage;
  if (pass !== undefined) t.pass = pass;
}

// ── log rendering (mirrors the terminal formatter) ────────────────
function appendLog(ev) {
  const f = fmtEvent(ev);
  if (!f) return;

  const log = el("log");
  const stick = log.scrollTop + log.clientHeight >= log.scrollHeight - 24;
  const row = document.createElement("div");
  // Tag output rows so the toggle can hide/show them retroactively via CSS,
  // rather than dropping them at append time (which the toggle can't undo).
  row.className = ev.kind === "agent_output" ? "row out" : "row";
  const lane = ev.task ? `<span class="lane">[${esc(ev.task)}]</span>` : "";
  row.innerHTML = `<span class="t">${fmtTime(ev.ts)}</span><span class="g ${f.cls}">${f.glyph}</span>`
    + `<span class="${f.cls}">${esc(f.text)}</span> ${lane}`;
  log.appendChild(row);
  while (log.childElementCount > LOG_CAP) log.removeChild(log.firstChild);
  if (stick) log.scrollTop = log.scrollHeight;
}

function fmtEvent(ev) {
  const p = ev.payload || {};
  switch (ev.kind) {
    case "run_started": {
      const roles = ["ba", "dev", "devops"].filter(r => p.agents && p.agents[r])
        .map(r => `${r}=${p.agents[r]}`).join("  ");
      const tgt = p.epic || p.task || "";
      return { glyph: "▶", cls: "info", text: `${(p.mode || "").toUpperCase()} run ${tgt}  ${roles}`.trim() };
    }
    case "stage_changed": {
      const a = p.max_retries > 1 ? `  attempt ${p.retry + 1}/${p.max_retries}` : "";
      return { glyph: "▸", cls: "info", text: `${p.stage}${a}` };
    }
    case "agent_started": {
      const who = p.model ? `${p.agent} (${p.model})` : p.agent;
      return { glyph: "⟳", cls: "dim", text: `${p.role}  ${who}` };
    }
    case "agent_output":
      return { glyph: "·", cls: "dim", text: p.text || "" };
    case "agent_done":
      return p.error
        ? { glyph: "✗", cls: "err", text: `${p.role} failed  ${oneLine(p.error)}` }
        : { glyph: "✓", cls: "ok", text: `${p.role} done  ${p.prompt_tokens || 0}→${p.eval_tokens || 0} tok  ${(p.duration_seconds || 0).toFixed(1)}s` };
    case "qa_result":
      return p.passed
        ? { glyph: "✓", cls: "ok", text: `QA passed  ${p.target || ""}` }
        : { glyph: "✗", cls: "err", text: `QA failed  attempt ${p.attempt}/${p.max_retries}  ${oneLine(p.audit_error || p.test_error || "")}` };
    case "retry":
      return { glyph: "↻", cls: "warn", text: `self-heal retry (attempt ${p.attempt}/${p.max_retries} failed)` };
    case "delegation":
      return { glyph: "⇄", cls: "warn", text: `delegating to BA (cycle ${p.cycle + 1}/${p.max_cycle})` };
    case "file_written":
      return { glyph: "＋", cls: "ok", text: `${p.action} ${p.path}` };
    case "file_rejected":
      return { glyph: "⛔", cls: "err", text: `rejected ${p.path}  ${p.reason || ""}` };
    case "hitl_prompt":
      return { glyph: "⏸", cls: "warn", text: `awaiting approval (auto-yes in ${p.timeout_seconds}s)` };
    case "hitl_resolved":
      return { glyph: "▸", cls: "info", text: `HITL ${p.approved ? "approved" : "rejected"}${p.auto ? " (auto)" : ""}` };
    case "run_finished": {
      const head = p.success ? "run finished · success" : "run finished · FAILED";
      const stats = `${(p.duration_seconds || 0).toFixed(1)}s  ${p.total_prompt_tokens || 0}→${p.total_eval_tokens || 0} tok  ${p.total_retries_used || 0} retries  ${p.lines_of_code_generated || 0} LOC`;
      const why = p.reason ? `  — ${oneLine(p.reason)}` : "";
      return { glyph: "■", cls: p.success ? "ok" : "err", text: `${head}  ${stats}${why}` };
    }
    default: return null;
  }
}

// ── helpers ───────────────────────────────────────────────────────
function oneLine(s) {
  let first = "";
  for (const raw of String(s).split("\n")) {
    const t = raw.trim();
    if (!t) continue;
    if (!first) first = t;
    if (!t.startsWith("# ")) return t;
  }
  return first;
}
function esc(s) { const d = document.createElement("div"); d.textContent = s == null ? "" : String(s); return d.innerHTML; }
function fmtNum(n) { return n >= 1000 ? (n / 1000).toFixed(1) + "k" : String(n); }
function tsMs(ts) { const m = Date.parse(ts); return isNaN(m) ? null : m; }
function fmtTime(ts) { const m = tsMs(ts); if (m == null) return "--:--:--"; const d = new Date(m); return d.toTimeString().slice(0, 8); }

function setStatus(s) {
  const dot = el("dot"); dot.className = "dot " + s;
}

// elapsed timer
setInterval(() => {
  if (!state || state.startMs == null) return;
  const end = state.finished && state.endMs != null ? state.endMs : Date.now();
  el("elapsed").textContent = ((end - state.startMs) / 1000).toFixed(1) + "s";
}, 250);

// theme toggle (persisted)
(function theme() {
  const saved = localStorage.getItem("harness-theme");
  if (saved) document.documentElement.setAttribute("data-theme", saved);
  el("theme").onclick = () => {
    const cur = document.documentElement.getAttribute("data-theme");
    const next = cur === "dark" ? "light" : cur === "light" ? "dark"
      : (matchMedia("(prefers-color-scheme: dark)").matches ? "light" : "dark");
    document.documentElement.setAttribute("data-theme", next);
    localStorage.setItem("harness-theme", next);
  };
})();

function applyOutputToggle() {
  document.body.classList.toggle("hide-output", !el("show-output").checked);
}
el("show-output").onchange = applyOutputToggle;

// ── SSE ───────────────────────────────────────────────────────────
function connect() {
  const es = new EventSource("/events");
  es.onopen = () => { el("conn").textContent = "● live"; if (!state) setStatus("waiting"); };
  es.onmessage = e => { try { handle(JSON.parse(e.data)); } catch (_) {} };
  es.onerror = () => { el("conn").textContent = "reconnecting…"; };
}
renderPipe(); renderTiles();
connect();
</script>
</body>
</html>
