services:
  # ── Harness Pipeline ────────────────────────────────────────────────────
  harness:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: harness-pipeline
    volumes:
      - ./workspace:/app/workspace
      - ./memory:/app/memory
      - ./harness_config.json:/app/harness_config.json:ro
      - ~/.cache/huggingface/hub:/root/.cache/huggingface/hub:ro
    stdin_open: true
    tty: true
